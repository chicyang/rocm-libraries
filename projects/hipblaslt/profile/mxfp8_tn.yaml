  # PrintTensorD: 1
  # PrintTensorRef: 1
  NumWarmups: 2
  EnqueuesPerSync: 100
  # PrintWinnersOnly: True
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2
  # SkipSlowSolutionRatio: 0.8
  CheckASMCodeSize: True
  RotatingBufferSize: 256

BenchmarkProblems:
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: f8
      DestDataType: f8
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0

